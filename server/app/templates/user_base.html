<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>{% block title %}FDEX 用户中心{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/user_portal.css">
</head>
<body>
<div class="user-shell">
    <header class="user-topbar">
        <a class="user-brand" href="/account/messages">
            <span class="user-brand-mark">F</span>
            <span>FDEX 用户中心</span>
        </a>
        <nav class="user-nav" aria-label="用户中心导航">
            <a href="/account/messages" class="{% if current_path.startswith('/account/messages') or current_path.startswith('/account/chat/') %}active{% endif %}">消息</a>
            <a href="/account/employees" class="{% if current_path.startswith('/account/employees') %}active{% endif %}">智体</a>
            <a href="/account/knowledge" class="{% if current_path.startswith('/account/knowledge') %}active{% endif %}">知识库</a>
            <a href="/account/work" class="{% if current_path.startswith('/account/work') %}active{% endif %}">工作</a>
            <a href="/account/groups" class="{% if current_path.startswith('/account/groups') %}active{% endif %}">工作群</a>
            <a href="/account/agent" class="{% if current_path.startswith('/account/agent') and not current_path.startswith('/account/agent/inputs') %}active{% endif %}">Coding Agent</a>
            <a href="/account/agent/inputs" class="{% if current_path.startswith('/account/agent/inputs') %}active{% endif %}">Agent 输入</a>
            <a href="/account/github" class="{% if current_path.startswith('/account/github') %}active{% endif %}">GitHub</a>
            <a href="/account/discover" class="{% if current_path.startswith('/account/discover') %}active{% endif %}">发现</a>
            <a href="/account/me" class="{% if current_path.startswith('/account/me') or current_path.startswith('/account/settings') or current_path.startswith('/account/security') or current_path.startswith('/account/deleted') or current_path.startswith('/account/info/') %}active{% endif %}">我的</a>
        </nav>
        {% if user %}
        <div class="account-chip">
            <div><strong>{{ user.name }}</strong><small>{{ user.email }}</small></div>
            <form action="/account/logout" method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <button type="submit" class="secondary">退出</button>
            </form>
        </div>
        {% endif %}
    </header>
    {% if flash %}
    <div class="alert alert-{{ flash.category }}">{{ flash.message }}</div>
    {% endif %}
    <main class="page">
        {% block content %}{% endblock %}
    </main>
</div>
<script src="/static/user_chat.js" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
