<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>重置密码 · FDEX 用户中心</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/user_portal.css">
</head>
<body>
<div class="login-wrap">
    <section class="login-card stack">
        <div class="brand-center"><span class="user-brand-mark">F</span><strong>FDEX 用户中心</strong></div>
        <div>
            <h1>重置 FDEX 密码</h1>
            <p class="muted">输入邮件中的 6 位验证码和新密码。重置成功后，旧会话会按中心账号安全策略失效。</p>
        </div>
        {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
        <form action="/account/password/reset" method="post" class="stack">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div><label for="email">注册邮箱</label><input id="email" name="email" type="email" maxlength="254" value="{{ email }}" autocomplete="email" required></div>
            <div><label for="code">邮件验证码</label><input id="code" name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="6 位数字" required></div>
            <div><label for="new_password">新密码</label><input id="new_password" name="new_password" type="password" minlength="8" maxlength="256" autocomplete="new-password" required></div>
            <div><label for="confirm_password">确认新密码</label><input id="confirm_password" name="confirm_password" type="password" minlength="8" maxlength="256" autocomplete="new-password" required></div>
            <button type="submit" class="primary">验证并重置密码</button>
        </form>
        <div class="divider"></div>
        <div class="row between">
            <a class="button button-secondary" href="/account/password/forgot{% if email %}?email={{ email }}{% endif %}">重新发送验证码</a>
            <a class="button button-secondary" href="/account/login">返回登录</a>
        </div>
    </section>
</div>
</body>
</html>
