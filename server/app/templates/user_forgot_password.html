<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>找回密码 · FDEX 用户中心</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/user_portal.css">
</head>
<body>
<div class="login-wrap">
    <section class="login-card stack">
        <div class="brand-center"><span class="user-brand-mark">F</span><strong>FDEX 用户中心</strong></div>
        <div>
            <h1>找回 FDEX 密码</h1>
            <p class="muted">输入注册邮箱。为了保护账号隐私，无论邮箱是否存在，页面都不会公开注册状态。</p>
        </div>
        {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
        {% if message %}<div class="alert alert-success">{{ message }}</div>{% endif %}
        {% if mail_ready %}
        <form action="/account/password/forgot" method="post" class="stack">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div><label for="email">注册邮箱</label><input id="email" name="email" type="email" maxlength="254" value="{{ email }}" autocomplete="email" required></div>
            <button type="submit" class="primary">发送密码重置验证码</button>
        </form>
        {% else %}
        <div class="alert alert-error">中心服务端邮件发送功能尚未配置，暂时无法自动找回密码，请联系管理员。</div>
        {% endif %}
        <div class="divider"></div>
        <div class="row between">
            <a class="button button-secondary" href="/account/login">返回登录</a>
            <a class="button button-secondary" href="/account/password/reset{% if email %}?email={{ email }}{% endif %}">已有验证码，重置密码</a>
        </div>
    </section>
</div>
</body>
</html>
