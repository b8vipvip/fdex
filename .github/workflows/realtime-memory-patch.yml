name: Apply realtime text memory patch

on:
  push:
    branches: ["agent/realtime-text-memory"]
    paths: [".fdex/realtime_memory_patch.py"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/realtime-text-memory
          fetch-depth: 0
      - name: Apply realtime memory integration
        run: python3 .fdex/realtime_memory_patch.py
      - name: Static checks
        run: |
          python3 -m py_compile server/app/fdex_memory.py server/app/realtime_memory.py server/app/realtime_voice.py server/tests/test_realtime_memory.py
          git diff --check
      - name: Commit generated implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/b8vipvip/fdex/network/RealtimeVoiceClient.kt \
                  app/src/main/java/com/b8vipvip/fdex/ui/RealtimeVoiceDialog.kt \
                  app/src/main/java/com/b8vipvip/fdex/ui/StreamingChatScreens.kt \
                  server/app/fdex_memory.py server/app/realtime_memory.py server/app/realtime_voice.py \
                  server/tests/test_realtime_memory.py docs/memory-system-layers.md
          git commit -m "接入 Realtime 纯文本长期记忆"
          git push origin HEAD:agent/realtime-text-memory
