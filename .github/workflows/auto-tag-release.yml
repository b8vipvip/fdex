name: Auto Tag Release

on:
  workflow_run:
    workflows: ["Build and Test"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fdex-auto-release-tag
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      contains(github.event.workflow_run.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve next patch version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          LATEST="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [[ -z "$LATEST" ]]; then
            VERSION_NAME="1.0.0"
          else
            VERSION="${LATEST#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            VERSION_NAME="${MAJOR}.${MINOR}.$((10#$PATCH + 1))"
          fi
          TAG="v${VERSION_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}" "${{ github.event.workflow_run.head_sha }}"
          git push origin "${{ steps.version.outputs.tag }}"
          echo "Tagged ${{ github.event.workflow_run.head_sha }} as ${{ steps.version.outputs.tag }}; Release Android APK is the sole build/publish authority."
