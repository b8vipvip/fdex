# 在宝塔面板：网站 -> fdex.k2n.cn -> 配置文件
# 将下面内容放进对应 server { ... } 内，或通过“反向代理”界面配置。
# 如果 server/.env 修改了 FDEX_PORT，这里的端口必须同步修改。

client_max_body_size 100m;

location / {
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # FDEX /api/client/ai/stream uses SSE. Do not buffer the upstream
    # response, otherwise chat2api deltas arrive at Android in one batch.
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection "";

    proxy_connect_timeout 30s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
}
